name: Deploy Imobidon

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Executar comandos no servidor via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: garcia  # Colocamos direto aqui para garantir
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/imobiliaria
            git config core.fileMode false
            git pull origin master
            # O --force-recreate garante que o Docker não ignore mudanças de config
            docker compose up -d --build --force-recreate
            # Roda as migrações e coleta estáticos no container novo
            docker compose exec -T web python backend/manage.py migrate
            docker compose exec -T web python backend/manage.py collectstatic --noinput
            # Limpa imagens antigas para não encher o disco da VPS
            docker image prune -f