version: '3.8'

services:
  web:
    build: .
    command: sh -c "python backend/manage.py collectstatic --noinput && gunicorn --chdir backend --bind 0.0.0.0:8000 config.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/backend/media
    env_file:
      - .env
    ports:
      - "8000:8000" # Expondo para o Nginx Proxy Manager acessar
    environment:
      - DB_HOST=db
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: always

  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/backend/media
    ports:
      - "80:80"
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
