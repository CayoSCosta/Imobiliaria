services:
  # --- O PORTEIRO (PROXY) ---
  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'   # Porta do site
      - '81:81'   # Painel de controle
      - '443:443' # Porta SSL
    volumes:
      - ./proxy_data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - imobidom_net

  # --- A APLICAÇÃO (DJANGO) ---
  web:
    build: .
    command: sh -c "python backend/manage.py collectstatic --noinput && gunicorn --chdir backend --bind 0.0.0.0:8000 config.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/backend/media
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      - db
    restart: always
    networks:
      - imobidom_net

  # --- NGINX INTERNO (STATIC/MEDIA + PROXY PARA DJANGO) ---
  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/backend/media:ro
    depends_on:
      - web
    restart: always
    networks:
      - imobidom_net

  # --- O BANCO DE DADOS ---
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: always
    networks:
      - imobidom_net

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  imobidom_net:
    driver: bridge