
<div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 280px; min-height: 100vh;">
    <a href="{% url 'imoveis:custom_admin_index' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
        <i class="fas fa-shield-alt fa-2x text-primary me-2"></i>
        <span class="fs-4">Painel Admin</span>
    </a>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
            <a href="{% url 'imoveis:custom_admin_index' %}" class="nav-link text-white {% if request.resolver_match.url_name == 'custom_admin_index' %}active{% endif %}" aria-current="page">
                <i class="fas fa-tachometer-alt me-2"></i>
                Dashboard
            </a>
        </li>
        <li>
            <a href="{% url 'imoveis:custom_admin_imoveis_list' %}" class="nav-link text-white {% if 'imoveis' in request.path and not 'orulo' in request.path %}active{% endif %}">
                <i class="fas fa-home me-2"></i>
                Imóveis
            </a>
        </li>
        <li>
            <a href="{% url 'leads:custom_admin_leads_list' %}" class="nav-link text-white {% if 'leads' in request.path %}active{% endif %}">
                <i class="fas fa-user-friends me-2"></i>
                Leads
            </a>
        </li>
        <li>
            <a href="{% url 'blog:custom_admin_blog_list' %}" class="nav-link text-white {% if 'blog' in request.path %}active{% endif %}">
                <i class="fas fa-newspaper me-2"></i>
                Blog
            </a>
        </li>
        <li>
            <a href="{% url 'imoveis:custom_admin_orulo_list' %}" class="nav-link text-white {% if 'orulo' in request.path %}active{% endif %}">
                <i class="fas fa-network-wired me-2"></i>
                Gestão Órulo
            </a>
        </li>
        <li>
            <a href="{% url 'audit:custom_admin_audit_list' %}" class="nav-link text-white {% if 'audit' in request.path %}active{% endif %}">
                <i class="fas fa-history me-2"></i>
                Auditoria
            </a>
        </li>
    </ul>
    <hr>
    <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
             <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center text-white me-2" style="width: 32px; height: 32px;">
                {{ user.first_name|first|default:user.username|first|upper }}
            </div>
            <strong>{{ user.username }}</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
            <li><a class="dropdown-item" href="/">Ver Site</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="dropdown-item">Sair</button>
                </form>
            </li>
        </ul>
    </div>
</div>

<style>
    /* Ajustes para o link ativo no tema escuro */
    .nav-pills .nav-link.active {
        background-color: #0d6efd;
    }
    .nav-pills .nav-link:hover:not(.active) {
        background-color: rgba(255,255,255,0.1);
    }
</style>
